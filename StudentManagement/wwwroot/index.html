<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-graduation-cap"></i> EduAdmin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active"><i class="fa-solid fa-users"></i> Sinh viên</a>
                <a href="#"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="#"><i class="fa-solid fa-gear"></i> Cài đặt</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Quản lý Sinh viên</h1>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Admin">
                </div>
            </header>

            <div class="content-wrapper">
                <div class="card table-card">
                    <div class="card-header">
                        <h3>Danh sách Sinh viên</h3>
                        <div class="header-actions">
                            <div class="search-box">
                                <i class="fa-solid fa-search"></i>
                                <input type="text" id="searchInput" placeholder="Lọc theo mã lớp...">
                            </div>
                            <button class="btn btn-primary" onclick="app.openForm()">
                                <i class="fa-solid fa-plus"></i> Thêm Sinh viên
                            </button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table" id="studentTable">
                            <thead>
                                <tr>
                                    <th>Mã SV</th>
                                    <th>Họ Tên</th>
                                    <th>Lớp</th>
                                    <th>Phái</th>
                                    <th>Tín chỉ tích lũy</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be injected here by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Student Modal Form -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm Sinh viên mới</h3>
                <button class="close-btn" onclick="app.closeForm()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <!-- Thông tin cơ bản -->
                    <div class="section-title">Thông tin cơ bản</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Mã SV <span class="required">*</span></label>
                            <input type="text" id="masv" required>
                        </div>
                        <div class="form-group">
                            <label>Họ Tên <span class="required">*</span></label>
                            <input type="text" id="hoten" required>
                        </div>
                        <div class="form-group">
                            <label>Lớp <span class="required">*</span></label>
                            <input type="text" id="malop" required>
                        </div>
                        <div class="form-group">
                            <label>Phái</label>
                            <select id="phai">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tuổi</label>
                            <input type="number" id="tuoi" min="1">
                        </div>
                        <div class="form-group">
                            <label>Khoa</label>
                            <input type="text" id="khoa">
                        </div>
                        <div class="form-group">
                            <label>Năm học</label>
                            <input type="text" id="namhoc">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email">
                        </div>
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="tel" id="sdt" pattern="0[0-9]{9,10}">
                        </div>
                    </div>

                    <!-- Ngoại ngữ -->
                    <div class="section-title">
                        Ngoại ngữ
                        <button type="button" class="btn btn-sm btn-outline" onclick="app.addLanguageRow()">
                            <i class="fa-solid fa-plus"></i> Thêm
                        </button>
                    </div>
                    <div id="languagesContainer" class="dynamic-container">
                        <!-- Dynamic rows -->
                    </div>

                    <!-- Môn học -->
                    <div class="section-title">
                        Môn học
                        <button type="button" class="btn btn-sm btn-outline" onclick="app.addSubjectRow()">
                            <i class="fa-solid fa-plus"></i> Thêm
                        </button>
                    </div>
                    <div id="subjectsContainer" class="dynamic-container">
                        <!-- Dynamic rows -->
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeForm()">Hủy</button>
                <button class="btn btn-primary" onclick="app.saveStudent()">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>
</html>
